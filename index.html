<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>English XI Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
/* Layout: one centered column; home -> stage map -> question screen with sticky status bar -> result card. */
:root{
  --bg:#f1f4ef; --surface:#ffffff; --fg:#14302b; --muted:#566a64; --line:#d3dcd6;
  --accent:#0b6b5b; --accent-ink:#ffffff; --accent-soft:#dcefe9;
  --gold:#b97d10; --gold-soft:#f7e9c8;
  --good:#1b7f48; --good-soft:#dff3e6; --bad:#b0342c; --bad-soft:#f9dfdc;
  --display:'Bricolage Grotesque',system-ui,sans-serif; --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1917; --surface:#13261f; --fg:#e4efe9; --muted:#9bb2aa; --line:#2a403a;
  --accent:#4cc2a8; --accent-ink:#05211b; --accent-soft:#163a33;
  --gold:#e0a93b; --gold-soft:#3a2f12; --good:#55d08a; --good-soft:#153a26; --bad:#ff8b80; --bad-soft:#44201d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1917; --surface:#13261f; --fg:#e4efe9; --muted:#9bb2aa; --line:#2a403a;
  --accent:#4cc2a8; --accent-ink:#05211b; --accent-soft:#163a33;
  --gold:#e0a93b; --gold-soft:#3a2f12; --good:#55d08a; --good-soft:#153a26; --bad:#ff8b80; --bad-soft:#44201d; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;margin:0;
  padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto}
.hero{padding:40px 0 8px;display:grid;gap:14px;justify-items:start}
.hero svg{width:64px;height:64px;color:var(--accent)}
.hero h1{font-size:clamp(2.1rem,7vw,3.2rem);letter-spacing:-.02em}
.hero p{margin:0;color:var(--muted);max-width:56ch}
.eyebrow{font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;color:var(--gold);font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.stack{display:grid;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
label.f{display:grid;gap:6px;font-weight:600;font-size:.92rem}
input[type=text],input[type=number],select,textarea{background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
textarea{min-height:140px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:11px 18px;font-weight:700;cursor:pointer}
.btn.alt{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn.sm{padding:7px 12px;font-size:.88rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:.94rem}
.chk input{margin-top:4px;width:18px;height:18px;accent-color:var(--accent)}
.note{font-size:.88rem;color:var(--muted)}
/* status bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.bar .row{justify-content:space-between}
.stat{display:flex;gap:14px;font-size:.88rem;font-weight:600;font-variant-numeric:tabular-nums}
.stat span b{font-family:var(--display);font-size:1.05rem}
.prog{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--accent);transition:width .3s}
/* map */
.stages{display:grid;gap:12px;margin-top:18px}
.stage{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center}
.num{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;background:var(--accent-soft);color:var(--accent)}
.stage.done .num{background:var(--accent);color:var(--accent-ink)}
.stage h3{font-size:1.1rem}
.stage .meta{font-size:.85rem;color:var(--muted)}
.stars{color:var(--gold);letter-spacing:2px;font-size:.95rem}
@media (max-width:520px){.stage{grid-template-columns:44px 1fr}.stage .btn{grid-column:1/-1}}
/* question */
.qhead{display:flex;gap:10px;align-items:center;margin:18px 0 8px}
.qn{font-family:var(--display);font-weight:800;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:2px 10px;font-size:1.05rem}
.pts{font-size:.82rem;color:var(--muted)}
.ins{font-style:italic;color:var(--muted);margin:0 0 8px;font-size:.95rem}
.q{font-size:1.1rem;margin:0 0 14px}
.q u{text-decoration-thickness:2px;text-underline-offset:3px}
.mk{font-size:.68rem;vertical-align:sub;color:var(--gold);margin-left:1px}
.passage{border-left:4px solid var(--gold);background:var(--surface);border-radius:0 12px 12px 0;padding:14px 16px;margin:0 0 16px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.passage h3{font-size:1.05rem;margin-bottom:8px}
.passage p{margin:0 0 9px;max-width:68ch}
.passage p:last-child{margin:0}
.passage .pl{font-weight:800;color:var(--accent);margin-right:6px}
.opts{display:grid;gap:9px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .ltr{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:.85rem}
.opt.ok{background:var(--good-soft);border-color:var(--good)}
.opt.no{background:var(--bad-soft);border-color:var(--bad)}
.opt.gone{opacity:.28}
.opts.three{grid-template-columns:repeat(3,1fr)}
@media (max-width:520px){.opts.three{grid-template-columns:1fr}}
.fb{margin-top:16px;border-radius:12px;padding:14px 16px}
.fb.good{background:var(--good-soft);border:1px solid var(--good)}
.fb.bad{background:var(--bad-soft);border:1px solid var(--bad)}
.fb.mid{background:var(--gold-soft);border:1px solid var(--gold)}
.fb b.v{font-family:var(--display);font-size:1.05rem}
.fb ul{margin:8px 0 0;padding-left:20px}
.fb li{margin:3px 0}
.life{background:none;border:1.5px dashed var(--gold);color:var(--gold);border-radius:20px;padding:3px 12px;font-weight:700;font-size:.82rem;cursor:pointer}
.life:disabled{opacity:.4;cursor:not-allowed}
/* listening */
.listen{border:1.5px solid var(--accent);border-radius:14px;padding:16px;background:var(--surface);margin-bottom:16px;display:grid;gap:12px}
.listen h3{font-size:1.05rem}
.pulse{width:44px;height:44px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;position:relative;flex:none}
.pulse::before,.pulse::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--accent);opacity:0}
.listen.on .pulse::before{animation:ring 1.6s infinite}
.listen.on .pulse::after{animation:ring 1.6s .8s infinite}
@keyframes ring{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.9);opacity:0}}
@media (prefers-reduced-motion:reduce){.listen.on .pulse::before,.listen.on .pulse::after{animation:none;opacity:.5}}
.pulse svg{width:22px;height:22px;color:var(--accent)}
.listen select{width:auto}
.trans{background:var(--bg);border-radius:10px;padding:12px 14px;font-size:.94rem}
.trans p{margin:0 0 6px}
.trans b{color:var(--accent)}
details summary{cursor:pointer;font-weight:600;font-size:.9rem;color:var(--accent)}
/* forms */
.items{display:grid;gap:12px}
.it{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.it input[type=text],.it input[type=number]{width:auto;flex:1 1 150px;max-width:260px}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl td,.tbl th{border:1px solid var(--line);padding:8px 10px;text-align:left}
.tbl th{background:var(--accent-soft);color:var(--accent)}
.tblwrap{overflow-x:auto}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;text-align:left}
.chip.used{opacity:.35}
.slots{display:grid;gap:6px;margin:10px 0}
.slot{display:flex;gap:10px;align-items:center;min-height:42px;border:1.5px dashed var(--line);border-radius:10px;padding:6px 10px}
.slot b{color:var(--gold);font-family:var(--display)}
.res.ok{color:var(--good);font-weight:700}.res.no{color:var(--bad);font-weight:700}
.bigscore{font-family:var(--display);font-weight:800;font-size:clamp(3rem,14vw,5rem);color:var(--accent);line-height:1}
.badges{display:flex;flex-wrap:wrap;gap:8px}
.badge{background:var(--gold-soft);color:var(--gold);border-radius:20px;padding:4px 12px;font-weight:700;font-size:.85rem}
.sel{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.tm.warn{color:var(--bad)}
.qdiv{font-family:var(--display);font-weight:700;font-size:.8rem;letter-spacing:.09em;text-transform:uppercase;color:var(--gold);border-top:1px solid var(--line);padding-top:12px;margin:18px 0 10px}
.rv{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.rv p{margin:4px 0}.rv ul{margin:6px 0 0;padding-left:18px}.rv li{margin:4px 0}
</style>

<div class="wrap" id="app"></div>

<script>
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const norm=t=>String(t||'').toLowerCase().replace(/[’‘`]/g,"'").replace(/\s+/g,' ').trim();
const num=v=>{const d=String(v||'').replace(/[^\d]/g,'');return d?parseInt(d,10):NaN};
const rp=n=>'Rp'+n.toLocaleString('id-ID');
const LET='ABCDE';

/* ---------- listening scripts (S1,S2 male voices; S3,S4 female voices) ---------- */
const SCRIPTS={
 s1:{title:'Script 1',range:'Soal 1–2',g:'m',spk:{A:'Hamzah',B:'Irfan'},lines:[
  ['A',"Hi, Irfan! I haven't seen you since the holidays. How's the new school year going?"],
  ['B',"Pretty well, actually. I've joined the robotics club, and we've just started building a small robot that waters the plants around the school mosque."],
  ['A',"Really? I didn't know you liked programming."],
  ['B',"I don't, to be honest. I've never written a single line of code. I'm on the design team. I've drawn two plans so far, but I haven't finished the final one yet."],
  ['A',"Who's leading the club?"],
  ['B',"Mr. Salim. He wants every team member to suggest ideas. I know I want a solar-powered design, but I don't have all the details yet."],
  ['A',"I've always loved building things. Could I visit a meeting?"],
  ['B',"Sure! We meet every Wednesday. Actually, we need someone who can translate a few lines into Arabic for our competition poster. Do you speak it?"],
  ['A',"I've been studying it at my Islamic boarding school since I was ten. I wouldn't say I'm an expert, but I understand most of what I read."],
  ['B',"Perfect. I'll tell Mr. Salim."]]},
 s2:{title:'Script 2',range:'Soal 3–4',g:'m',spk:{A:'Reporter',B:'Mr. Hasan'},lines:[
  ['A',"Mr. Hasan, thank you for talking to us. Could you tell us what happened that afternoon?"],
  ['B',"Of course. I had been checking the hiking trail since two o'clock when the rain started. By the time I heard the whistle, the group of students had already walked far from the main path."],
  ['A',"How many students were there?"],
  ['B',"Six students from a local school. They had gone up to see the waterfall, and none of them had noticed that the river was rising."],
  ['A',"What did you do?"],
  ['B',"Without thinking twice, I ran toward the sound. I'd been worried about my own flashlight all afternoon because it had stopped working twice, but luckily it worked this time."],
  ['A',"Were the students hurt?"],
  ['B',"Only frightened. One boy had been shivering for an hour, but he calmed down when I gave him my jacket. Honestly, I'm no hero. Anyone would have done the same."],
  ['A',"Many people disagree with you."]]},
 s3:{title:'Script 3',range:'Soal 5–6',g:'f',spk:{A:'Aisyah',B:'Nadia'},lines:[
  ['A',"Nadia, have you finished the banners for Charity Week?"],
  ['B',"Almost. I've been working on them since Monday, and I've painted about fifteen so far. I hung the first ones outside the canteen yesterday."],
  ['A',"Great. Did anyone from Class 11 sign up for the archery demonstration?"],
  ['B',"Yes, they signed up last week. They've been practising every afternoon since then. They've already given two demonstrations for the teachers, and Mr. Rahmat was very impressed."],
  ['A',"And what about the coupon sales for the bazaar?"],
  ['B',"That's the problem. We've sold only eighteen coupons so far, and we expected at least a hundred and fifty by now. I've been calling sponsors all morning, but nobody has replied yet."],
  ['A',"All things considered, we're doing well except for the coupons. Maybe I could post about it on the school's social media account."],
  ['B',"Good idea. In brief, we need more visitors."]]},
 s4:{title:'Script 4',range:'Soal 7–8',g:'f',spk:{A:'Salsa',B:'Dewi'},lines:[
  ['A',"Dewi, are you joining the class trip to Malang? It costs two million, seven hundred thousand rupiah."],
  ['B',"I'd love to, but it's a lot. I've saved four hundred and fifty thousand rupiah so far."],
  ['A',"When do you have to pay?"],
  ['B',"The final deadline is five months from now. I earn three hundred thousand rupiah a month from selling homemade cakes, and I'll put all of it aside."],
  ['A',"So by then you'll have saved one million, five hundred thousand rupiah more."],
  ['B',"Right. I'll still be short, but my mother has promised to cover the difference."],
  ['A',"Good. You don't have to pay everything at once, by the way. The school lets you pay in two parts, but you must register before the end of this month, or you'll lose your place."],
  ['B',"Thanks for the warning. I mustn't forget that. And I needn't bring the permission letter until the week of the trip."]]}
};

/* ---------- reading passages ---------- */
const PASS={
 podium:{t:'Behind the Podium',p:[
  ["","Hasan Maulana has always been known as the quiet boy in his class. He has belonged to the school debate club since Year 10, but until recently he only worked behind the scenes. “I know I'm shy,” he admits. “I prefer researching arguments to presenting them.”"],
  ["","Last spring, however, something changed. His coach asked him to deliver a three-minute speech at a regional competition. Hasan had never spoken in public before, so at first he felt overwhelmed. Since then he has watched dozens of speeches by Indonesian scholars and has been taking notes on how speakers explain ideas in simple words."],
  ["","Now he is practising with eight classmates every weekend. His speech, about a boy who is afraid of speaking up, hasn't been finished yet, but Hasan believes it is the most honest work he has ever done. “I don't need to be loud,” he says. “I just need to be clear about what I want to say.”"]]},
 spring:{t:'The Hidden Spring',p:[
  ["","Dr. Maryam Hakim had been studying the rainforest plants of Kalimantan for eight years when she first heard about the spring. Local villagers had been telling stories about it for generations, but no scientist had ever reached it. Bravely, Maryam decided to lead a small team to find it."],
  ["","The expedition did not begin well. By the time the team reached the foot of the mountain, heavy rain had been falling for three days, and their truck had broken down twice. Without warning, the rain stopped on their fourth morning, and the team finally entered the forest. Deep inside, they discovered a clear spring surrounded by rare ferns that had grown undisturbed for centuries."],
  ["","Maryam later said that the trip had taught her patience. “We had planned everything for months,” she explained, “but nature had other plans. The delay was frustrating, and yet it was the reason we found the spring at the best moment: the river had become safe to cross.”"]]},
 fair:{t:'The Al-Hikmah Book Fair',p:[
  ["A","The Al-Hikmah Book Fair began in 2012, when a group of local teachers organised a one-day exhibition in a mosque hall. Only about 150 people attended. Since then, the fair has grown into a week-long event, and last year it welcomed more than 12,000 visitors."],
  ["B","Much of this growth is thanks to volunteers. For the past four months, around forty students have been building stalls from bamboo, and they have already finished the main one. Last Saturday, a group of calligraphy artists visited the site and inspected the new stall, and they praised its design."],
  ["C","The fair has not been without problems. Last year, heavy rain forced the organisers to cancel the final day, and many ticket holders asked for refunds. This year, the committee has been negotiating with a local company to build a large tent. All things considered, however, the fair has done more good than harm: local families have earned extra income, and young writers have gained a platform for their talent."]]},
 saving:{t:'Zahra’s Saving Plan',p:[
  ["A","When Zahra started university, her parents told her that she would have to manage her own allowance of Rp2,000,000 a month. At first she spent most of it on food delivery and online shopping, and by the twentieth of every month she had run out of money."],
  ["B","After three months, Zahra decided to change. She didn't have to give up everything she enjoyed, but she needed to separate her essential costs from her wants. Rent (Rp1,000,000), transport (Rp300,000), and groceries (Rp450,000) are bills she must pay every month. That leaves Rp250,000 for everything else."],
  ["C","Zahra now sets aside Rp100,000 of that every month for a study tour to Malaysia that will cost Rp2,500,000. If she keeps this routine for twelve months, she will have saved Rp1,200,000, and she will have been saving for a whole year. She admits that this is still not enough, so she plans to sell some of her old textbooks."],
  ["D","Her advice to other students is simple: “You don't need a complicated app. You just need to write down every expense, and you mustn't spend your savings on small treats.”"]]}
};

/* ---------- questions ---------- */
const QS={};
/* mc: o[c] is correct. fixed => keep order */
const M=(n,st,q,o,exp,x={})=>{QS[n]=Object.assign({n,st,t:'mc',q,o,c:x.c||0,exp,max:x.max||2},x)};
const GI='Choose the best option to complete the sentence.', SY='Choose the word or phrase closest in meaning to the word in bold.', WC='Choose the best word to complete the sentence.', UL='Choose the underlined part that must be corrected.';
const TFNG=['TRUE','FALSE','NOT GIVEN'];

/* Stage 0: listening */
M(1,0,"What is the conversation mainly about?",[
 "Irfan's work on the club's robot and a way Hamzah might help.","Hamzah's plan to join the robotics club as a programmer.","Mr. Salim's decision to cancel the competition.","An Arabic course that Irfan wants to take.","Hamzah's experience of building a robot for the mosque."],
 "Irfan bercerita tentang proyek robot klubnya, lalu meminta Hamzah membantu menerjemahkan ke bahasa Arab.",{l:'s1'});
M(2,0,"Which sentence about the conversation is both true and grammatically correct?",[
 "Irfan has drawn two plans, but he hasn't finished the final one yet.","Hamzah is studying Arabic since he was ten.","Irfan has been programming the robot since September.","Mr. Salim has already finished the design.","Irfan has joined the robotics club last month."],
 "Irfan: “I've drawn two plans so far, but I haven't finished the final one yet.” Pilihan lain salah fakta, atau salah tata bahasa (since + present continuous; present perfect dengan waktu selesai “last month”).",{l:'s1'});
M(3,0,"Why were the students in danger?",[
 "They had not noticed that the river was rising.","Their flashlight had stopped working twice.","They had wanted to follow Mr. Hasan.","The rangers had closed the trail.","Mr. Hasan had forgotten to warn them."],
 "“None of them had noticed that the river was rising.” Senter yang mati adalah milik Mr. Hasan, bukan para siswa.",{l:'s2'});
M(4,0,"Which sentence describes the order of events correctly?",[
 "Before Mr. Hasan heard the whistle, the students had already walked far from the main path.","After Mr. Hasan had run toward the sound, the students had gone up to see the waterfall.","Mr. Hasan had given the boy his jacket before the boy had started shivering.","The rain had started before Mr. Hasan had begun checking the trail.","Mr. Hasan's flashlight had stopped working twice after he ran toward the students."],
 "Past perfect menandai kejadian yang lebih dulu: para siswa sudah berjalan jauh sebelum Mr. Hasan mendengar peluit.",{l:'s2'});
M(5,0,"What is the main problem the committee faces?",[
 "Coupon sales are much lower than expected.","The banners have not been hung yet.","The archery team has stopped practising.","The sponsors have refused to help.","Mr. Rahmat did not enjoy the demonstration."],
 "Baru 18 kupon terjual padahal target minimal 150. Sponsor belum membalas, bukan menolak.",{l:'s3'});
M(6,0,"Which sentence about the conversation is correct?",[
 "Nadia has been working on the banners since Monday.","Nadia has hung the first banners yesterday.","Class 11 has signed up for the archery demonstration last week.","The committee has sold a hundred coupons so far.","Nadia has been calling sponsors since Monday."],
 "Banner dikerjakan sejak Senin (since Monday). “Yesterday” dan “last week” butuh simple past; menelepon sponsor hanya sepanjang pagi (all morning).",{l:'s3'});
M(7,0,"According to Salsa, which statement about the payment is correct?",[
 "Dewi needn't pay everything at once, but she must register before the end of the month.","Dewi must pay the whole amount on the day of the trip.","Dewi mustn't register until the final deadline.","Dewi doesn't have to register if her mother pays the difference.","Dewi mustn't bring the permission letter before the week of the trip."],
 "Pembayaran boleh dua tahap (don't have to pay at once), tetapi pendaftaran wajib sebelum akhir bulan (must register).",{l:'s4'});
M(8,0,"By the final deadline, how much will Dewi have saved by herself, including the money she has now?",[
 "Rp1.950.000","Rp1.500.000","Rp2.700.000","Rp2.250.000","Rp750.000"],
 "Rp450.000 (sekarang) + 5 bulan × Rp300.000 = Rp450.000 + Rp1.500.000 = Rp1.950.000.",{l:'s4'});

/* Stage 1: vocabulary */
M(9,1,"Faisal is a <b>diligent</b> student; he finishes his homework every night, even when he is tired.",["Hardworking","Forgetful","Impatient","Selfish","Reserved"],"Diligent = rajin, sungguh-sungguh. Sinonimnya: hardworking.",{ins:SY});
M(10,1,"The volunteers had to <b>tolerate</b> the scorching heat for three days.",["Put up with","Run out of","Look forward to","Give up on","Take care of"],"Tolerate = menahan/menerima sesuatu yang tidak nyaman = put up with.",{ins:SY});
M(11,1,"Students must ______ many challenges, such as limited time and difficult subjects, before they reach their goals.",["Overcome","Overlook","Overtake","Overflow","Overreact"],"Overcome = mengatasi (tantangan). Overlook = mengabaikan; overtake = menyalip.",{ins:WC});

const S={name:'',limit:false,res:{},lifes:3,streak:0,best:0,usedLife:false,stage:0,pos:0,plays:{}};

/* ---------- text-to-speech ---------- */
const TTS=('speechSynthesis' in window)&&('SpeechSynthesisUtterance' in window);
const MALE=/\b(david|mark|guy|ryan|george|james|daniel|alex|fred|thomas|oliver|arthur|rishi|aaron|gordon|male|eric|christopher|roger|brian|andrew|liam|william|davis|jason|tony|sam|steffan|ethan|noah|richard|sean|mike|matthew)\b/i;
const FEMALE=/\b(zira|hazel|susan|samantha|karen|moira|tessa|victoria|fiona|serena|kate|female|jenny|aria|emma|michelle|ana|libby|sonia|amy|joanna|salli|ivy|kendra|kimberly|nicole|olivia|natasha|clara|catherine|allison|ava|nora|heather|sara|linda|jane|ashley|elizabeth|mia|maisie|ada)\b/i;
let VOICES=[],playTok=0,keep=[];
function loadVoices(){if(!TTS)return;VOICES=(speechSynthesis.getVoices()||[]).filter(v=>/^en([-_]|$)/i.test(v.lang));}
if(TTS){loadVoices();try{speechSynthesis.addEventListener('voiceschanged',loadVoices)}catch(e){}}
const isGB=v=>/^en[-_]GB$/i.test(v.lang),isUS=v=>/^en[-_]US$/i.test(v.lang);
const findV=re=>VOICES.find(v=>re.test(v.name));
/* Script 1-2: speaker 1 = Google UK English Male (en-GB), speaker 2 = a different male voice.
   Script 3-4: speaker 1 = Google UK English Female (en-GB), speaker 2 = Google US English (en-US). */
function voiceFor(sc,who){
  if(sc.g==='m'){
    const mv=v=>MALE.test(v.name)&&!FEMALE.test(v.name);
    const g=findV(/google uk english male/i);
    const A=g||VOICES.find(v=>isGB(v)&&mv(v))||VOICES.find(mv)||VOICES.find(isGB)||VOICES[0]||null;
    const aNat=!!(g||(A&&mv(A)));
    /* speaker 2: a clearly different male voice (e.g. Microsoft David/Mark/Guy, Daniel, Alex) */
    let B=VOICES.find(v=>v!==A&&mv(v)&&!/google/i.test(v.name))||VOICES.find(v=>v!==A&&mv(v));
    let bp=1;
    if(!B){
      B=VOICES.find(v=>v!==A&&!/google/i.test(v.name)&&!FEMALE.test(v.name)&&isUS(v))||VOICES.find(v=>v!==A&&!/google (us english|uk english female)/i.test(v.name)&&!FEMALE.test(v.name));
      bp=0.85;
    }
    if(!B){return who==='A'?{v:A,p:aNat?1.05:0.9}:{v:A,p:aNat?0.72:0.65}}
    return who==='A'?{v:A,p:aNat?1:0.8}:{v:B,p:bp};
  }
  const fem=v=>FEMALE.test(v.name)&&!MALE.test(v.name);
  const uk=findV(/google uk english female/i)||VOICES.find(v=>isGB(v)&&fem(v));
  const us=findV(/google us english/i)||VOICES.find(v=>isUS(v)&&fem(v));
  let v=who==='A'?(uk||us):(us||uk);
  if(!v)v=VOICES.find(fem)||VOICES[0]||null;
  const same=!uk||!us||uk===us;
  const base=(uk||us)?1:1.25;
  return {v,p:same?(who==='A'?base-0.08:base+0.12):base};
}
function stopAudio(){playTok++;keep=[];if(TTS){try{speechSynthesis.cancel()}catch(e){}}setPlayUI(false)}
function setPlayUI(on,label){
  const box=$('#lbox');if(!box)return;
  box.classList.toggle('on',on);
  const pb=$('#pbtn');if(pb)pb.textContent=on?'Berhenti':(cur&&S.plays[cur.q.l]?'Putar ulang':'Putar audio');
  const st=$('#lstat');if(st)st.textContent=label||(on?'Memutar…':'');
}
function playsLeft(id){return S.limit?Math.max(0,2-(S.plays[id]||0)):99}
function togglePlay(){
  const id=cur.q.l,sc=SCRIPTS[id];
  if($('#lbox').classList.contains('on')){stopAudio();return}
  if(!TTS){$('#lstat').textContent='Browser ini tidak mendukung suara. Gunakan Chrome, Edge, atau Safari terbaru.';return}
  if(!playsLeft(id))return;
  S.plays[id]=(S.plays[id]||0)+1;
  const tok=++playTok;try{speechSynthesis.cancel()}catch(e){}
  loadVoices();
  const rate=parseFloat($('#lrate').value)||1;
  let i=0;
  const next=()=>{
    if(tok!==playTok)return;
    if(i>=sc.lines.length){setPlayUI(false,'Selesai');updatePlays();return}
    const [who,text]=sc.lines[i++];
    const u=new SpeechSynthesisUtterance(text);
    const pick=voiceFor(sc,who);
    if(pick.v){u.voice=pick.v;u.lang=pick.v.lang}else u.lang='en-GB';
    u.rate=rate;u.pitch=Math.min(2,Math.max(0.1,pick.p));
    u.onend=()=>setTimeout(next,380);
    u.onerror=e=>{if(tok!==playTok)return;if(e&&(e.error==='canceled'||e.error==='interrupted'))return;setPlayUI(false,'Suara gagal diputar. Coba tekan Putar audio lagi.')};
    keep.push(u);if(keep.length>4)keep.shift();
    setPlayUI(true,`Memutar · pembicara ${who==='A'?1:2} dari 2 · bagian ${i}/${sc.lines.length}`);
    speechSynthesis.speak(u);
  };
  setPlayUI(true,'Memutar…');updatePlays();next();
}
function updatePlays(){
  const id=cur&&cur.q.l;if(!id)return;
  const el=$('#lplays');if(el)el.textContent=S.limit?`Sisa putar: ${playsLeft(id)} dari 2`:`Diputar ${S.plays[id]||0}×`;
  const pb=$('#pbtn');if(pb&&!$('#lbox').classList.contains('on'))pb.disabled=!playsLeft(id);
}

/* ---------- writing analysis (self-check) ---------- */
const STOP=new Set(['to','a','an','the','no','some','been','his','her','their','any','my','our','its','enough','it','this','that','many','much','one','two','three','time','fun','lunch','dinner','breakfast']);
const EXC=new Set(['only','early','family','daily','italy','july','reply','apply','supply','ally','belly','lily','holy','jelly','rely']);
function analyze(raw){
  const t=norm(raw),sents=raw.trim().split(/(?<=[.!?])\s+/).filter(s=>s.trim().length>2);
  let pp=0,m;const re=/\b(?:had|hadn't)\s+(?:(?:already|never|just|not|ever|still)\s+)*([a-z]+)/g;
  while((m=re.exec(t))){if(!STOP.has(m[1])&&!/ing$/.test(m[1]))pp++}
  const ppc=(t.match(/\b(?:had|hadn't)\s+(?:(?:already|never|just|not|still)\s+)*been\s+[a-z]+ing\b/g)||[]).length;
  const start=sents.filter(s=>{const x=norm(s).replace(/^["“'‘]/,'');const mm=x.match(/^(without\s+[a-z]+|([a-z]+ly))\b/);return mm&&!EXC.has(mm[2]||'')}).length;
  const modals=(t.match(/\b(?:don't have to|doesn't have to|do not have to|does not have to|mustn't|must not|needn't|need not|must|have to|has to|need to|needs to)\b/g)||[]).length;
  const neg=(t.match(/\b(?:don't have to|doesn't have to|do not have to|does not have to|mustn't|must not|needn't|need not)\b/g)||[]).length;
  const fp=(t.match(/\b(?:will|won't)\s+(?:(?:not|never|already|definitely|probably)\s+)*have\s+(?!been\b)[a-z]+/g)||[]).length;
  const fpc=(t.match(/\b(?:will|won't)\s+(?:(?:not|never|already)\s+)*have\s+been\s+[a-z]+ing/g)||[]).length;
  return {n:sents.length,words:t.split(' ').filter(Boolean).length,pp,ppc,start,modals,neg,fp,fpc};
}

const TOTAL_MS=60*60*1000;let tick=null;
const left=()=>S.deadline?Math.max(0,S.deadline-Date.now()):TOTAL_MS;
const mmss=ms=>{const s=Math.ceil(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
function startTimer(){S.deadline=Date.now()+TOTAL_MS;S.over=false;clearInterval(tick);tick=setInterval(onTick,1000)}
function onTick(){
  const l=left();
  document.querySelectorAll('.tm').forEach(e=>{e.textContent=mmss(l);e.classList.toggle('warn',l<300000)});
  if(l<=0)timeUp();
}

/* grade a typed-answer question; lines are shown only in the final review */
function gradeGroup(q,get,order){
  let pts=0;const lines=[];
  const mine=v=>`<small class="note"> Jawabanmu: ${esc(v||'(kosong)')}</small>`;
  if(q.t==='fill'){
    q.items.forEach((it,i)=>{const raw=get('f'+i),ok=it.a.includes(norm(raw));if(ok)pts++;lines.push(`<li><span class="res ${ok?'ok':'no'}">${ok?'✓':'✗'}</span> ${esc(it.s.replace('___','['+it.m+']'))}${mine(raw)}</li>`)});
  }
  if(q.t==='table'){
    q.rows.filter(r=>typeof r[1]!=='string').forEach((r,i)=>{const raw=get('t'+i),ok=num(raw)===r[1];if(ok)pts++;lines.push(`<li><span class="res ${ok?'ok':'no'}">${ok?'✓':'✗'}</span> (${i+1}) ${r[0]}: <b>${rp(r[1])}</b>${mine(raw)}</li>`)});
    lines.push(`<li>${esc(q.exp)}</li>`);
  }
  if(q.t==='fix'){
    q.items.forEach((it,i)=>{const raw=get('x'+i),v=norm(raw),ok=it.re.test(v)&&!(it.no&&it.no.test(v));if(ok)pts++;lines.push(`<li><span class="res ${ok?'ok':'no'}">${ok?'✓':'✗'}</span> ${i+1}. <b>${esc(it.m)}</b> (${it.r})${mine(raw)}</li>`)});
  }
  if(q.t==='order'){
    const hit=order.filter((k,i)=>k===q.ans[i]).length,op=hit===5?2:hit>=3?1:0;pts+=op;
    lines.push(`<li><span class="res ${op===2?'ok':'no'}">${op===2?'✓':'✗'}</span> Urutan benar: <b>${q.ans.join(' → ')}</b> (urutanmu: ${order.join(' → ')||'kosong'}; ${op}/2 poin)</li>`);
    const raw=get('w44'),a=analyze(raw);
    if(a.words<20)lines.push('<li>Paragraf belum ditulis atau terlalu pendek, jadi bagian menulis bernilai 0.</li>');
    else [[a.pp>=2,`Past perfect ≥ 2 (ditemukan ${a.pp})`],[a.ppc>=1,`Past perfect continuous ≥ 1 (ditemukan ${a.ppc})`],[a.start>=2,`Adverb sentence starter ≥ 2 (ditemukan ${a.start})`]].forEach(x=>{if(x[0])pts++;lines.push(`<li><span class="res ${x[0]?'ok':'no'}">${x[0]?'✓':'✗'}</span> ${x[1]}</li>`)});
    if(raw.trim())lines.push(`<li>Tulisanmu: ${esc(raw)}</li>`);
    lines.push(`<li><b>Contoh paragraf:</b> ${esc(MODEL44)}</li>`);
  }
  if(q.t==='boss'){
    [2250000,250000,3600000,1800000].forEach((e,i)=>{const raw=get('b'+i),ok=num(raw)===e;if(ok)pts++;lines.push(`<li><span class="res ${ok?'ok':'no'}">${ok?'✓':'✗'}</span> ${['Total expenses','Savings per month','Total after 12 months','Shortfall'][i]}: <b>${rp(e)}</b>${mine(raw)}</li>`)});
    const dec=get('b4')==='no';if(dec)pts++;
    lines.push(`<li><span class="res ${dec?'ok':'no'}">${dec?'✓':'✗'}</span> Keputusan: <b>No</b>, ia tidak bisa mencapai target. Ia butuh (5.400.000 − 600.000) ÷ 12 = Rp400.000 per bulan.</li>`);
    const raw=get('w45'),a=analyze(raw);
    if(a.words<25)lines.push('<li>Rencana (b) belum ditulis atau terlalu pendek, jadi bagian (b) bernilai 0.</li>');
    else [[a.n>=5&&a.n<=7,`5–6 kalimat (ditemukan ${a.n})`],[a.modals>=2,`Modal of necessity ≥ 2 (ditemukan ${a.modals})`],[a.neg>=1,`Modal negatif ≥ 1 (ditemukan ${a.neg})`],[a.fp>=1,`Future perfect ≥ 1 (ditemukan ${a.fp})`],[a.fpc>=1,`Future perfect continuous ≥ 1 (ditemukan ${a.fpc})`]].forEach(x=>{if(x[0])pts++;lines.push(`<li><span class="res ${x[0]?'ok':'no'}">${x[0]?'✓':'✗'}</span> ${x[1]}</li>`)});
    if(raw.trim())lines.push(`<li>Tulisanmu: ${esc(raw)}</li>`);
    lines.push(`<li><b>Contoh jawaban (b):</b> ${esc(MODEL45)}</li>`);
  }
  return {pts,lines};
}

  const sp=i=>stagePts(i)/stageMax(i);
  const B=[];
  if(sp(0)>=.85)B.push('Pendengar Tajam');if(sp(1)>=.85)B.push('Raja Kosakata');if(sp(2)>=.85)B.push('Detektif Teks');if(sp(3)>=.85)B.push('Grammar Guru');
  if(S.res[42]&&S.res[42].pts===4)B.push('Kalkulator Hemat');
  if(S.best>=10)B.push('Streak '+S.best);
  if(answered===45&&!S.usedLife)B.push('Tanpa Bantuan');
  app.innerHTML=`<div class="bar"><div class="row"><h2 style="font-size:1.2rem">${S.over?'Waktu habis':'Semua stage selesai'}</h2></div></div>
  <div class="card stack" style="margin-top:18px"><div><span class="eyebrow">${esc(S.name||'Pemain')}</span><div class="bigscore">${fmt(tot)}<span style="font-size:1.6rem;color:var(--muted)"> / 100</span></div><h3 style="margin-top:6px">${title}</h3><p class="note" style="margin:6px 0 0">${answered} dari 45 soal dijawab.</p></div>
  ${B.length?`<div class="badges">${B.map(b=>`<span class="badge">${b}</span>`).join('')}</div>`:''}
  <div class="tblwrap"><table class="tbl"><tr><th>Stage</th><th>Poin</th></tr>${STAGES.map((s,i)=>`<tr><td>${i+1}. ${s.name}</td><td>${fmt(stagePts(i))} / ${stageMax(i)}</td></tr>`).join('')}</table></div>
  <div class="row"><button class="btn alt" data-act="restart">Main lagi</button></div></div>
  <h2 style="font-size:1.3rem;margin:26px 0 10px">Pembahasan</h2>
  <div class="stack">${Object.keys(QS).map(n=>reviewItem(+n)).join('')}</div>
  <h2 style="font-size:1.3rem;margin:26px 0 10px">Transkrip listening</h2>
  <div class="stack">${Object.values(SCRIPTS).map(sc=>`<div class="card"><h3 style="font-size:1.05rem;margin-bottom:8px">${sc.title} · ${sc.range}</h3><div class="trans">${sc.lines.map(l=>`<p><b>${esc(sc.spk[l[0]])}:</b> ${esc(l[1])}</p>`).join('')}</div></div>`).join('')}</div>`;
  window.scrollTo({top:0});
}

/* ---------- one attempt per name (kept in code only; no note shown to the player) ---------- */
const nameKey=n=>norm(n);
const nameId=k=>Array.from(k).map(c=>c.codePointAt(0).toString(36)).join('-').slice(0,190)||'x';
function localNames(){try{return JSON.parse(store.get('eq_names')||'[]')}catch(e){return []}}
function addLocalName(k){const a=localNames();if(!a.includes(k)){a.push(k);store.set('eq_names',JSON.stringify(a))}}
async function dbHandle(){
  try{
    if(!(window.claude&&window.claude.use))return null;
    return await Promise.race([claude.use('db'),new Promise(r=>setTimeout(()=>r(null),3000))]);
  }catch(e){return null}
}
/* returns 'ok' | 'taken' | 'empty'. Checks this browser first, then the shared db when this viewer has one. */
async function claimName(raw){
  const k=nameKey(raw);
  if(!k)return 'empty';
  if(localNames().includes(k))return 'taken';
  let ref=null;
  const db=await dbHandle();
  if(db){try{ref=db.doc('names/'+nameId(k));const snap=await ref.get();if(snap.exists)return 'taken'}catch(e){ref=null}}
  addLocalName(k);
  if(ref){try{await ref.set({t:Date.now()})}catch(e){}}
  return 'ok';
}
async function startFlow(btn){
  const raw=($('#nm').value||'').trim(),msg=$('#nmmsg');
  msg.textContent='';
  if(!raw){msg.textContent='Tulis namamu dulu.';return}
  btn.disabled=true;
  const r=await claimName(raw);
  if(r!=='ok'){msg.textContent='Nama ini tidak dapat digunakan.';btn.disabled=false;return}
  S.name=raw;S.limit=$('#lim').checked;S.res={};S.lifes=3;S.streak=0;S.best=0;S.usedLife=false;S.plays={};S.over=false;
  startTimer();map();
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act;
  if(S.over&&a!=='restart')return;
  if(a==='start')startFlow(b);
  else if(a==='map')map();
  else if(a==='stage')startStage(+b.dataset.i);
  else if(a==='pick')pick(+b.dataset.i);
  else if(a==='life')life();
  else if(a==='check')check();
  else if(a==='next')next();
  else if(a==='restart'){S.name='';S.res={};S.lifes=3;S.streak=0;S.best=0;S.usedLife=false;S.plays={};S.over=false;home()}
  else if(a==='play')togglePlay();
  else if(a==='ord'){if(cur.done)return;cur.order.push(b.dataset.k);renderOrder()}
  else if(a==='ordreset'){cur.order=[];renderOrder()}
});
window.addEventListener('pagehide',()=>{try{speechSynthesis.cancel()}catch(e){}});
window.__t={QS,S,STAGES,SCRIPTS,analyze,voiceFor,timeUp};
home();
</script>
